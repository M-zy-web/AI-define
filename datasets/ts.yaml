# 首版 ts.yaml：m5\datasets\tabulations\sdtm\ts.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: TS
label: 试验概要
class: 试验设计
purpose: 列表
repeating: false
is_reference_data: true
structure: 每个试验概要参数值一条记录
sas_dataset: TS
keys:
- STUDYID
- TSPARMCD
- TSSEQ
archive: ts.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  TSSEQ:
    label: 序号
    type: integer
    length: '1'
    order: 3
    key_sequence: 3
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  TSGRPID:
    label: 分组ID
    type: text
    length: '21'
    order: 4
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
  TSPARMCD:
    label: 试验概要参数简称
    type: text
    length: '8'
    order: 5
    key_sequence: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: TSPARMCD
  TSPARM:
    label: 试验概要参数
    type: text
    length: '40'
    order: 6
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: TSPARM
