    - where:
      - variable: TSPARMCD
        comparator: EQ
        values:
        - ACTSUB
      label: 参数值
      origin:
        type: Protocol
        source: Sponsor
      mandatory: false
      description: Actual Number of Subjects
    - where:
      - variable: TSPARMCD
        comparator: EQ
        values:
        - ADAPT
      codelist: NY_N
      label: 参数值
      origin:
        type: Protocol
        source: Sponsor
      mandatory: false
      description: Adaptive Design
    - where:
      - variable: TSPARMCD
        comparator: EQ
        values:
        - ADDON
