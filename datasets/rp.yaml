# 首版 rp.yaml：m5\datasets\tabulations\sdtm\rp.xpt+m5\datasets\tabulations\sdtm\supprp.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: RP
label: 生殖系统发现
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次访视每个时间点每次发现或结果一条记录
sas_dataset: RP
keys:
- STUDYID
- USUBJID
- SUBJID
- RPTESTCD
- RPDTC
- VISITNUM
archive: rp.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    key_sequence: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 3
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    mandatory: false
    origin: {type: Collected, source: Investigator}
  RPSEQ:
    label: 序号
    type: integer
    length: '1'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  RPTESTCD:
    label: 生殖检测的简称
    type: text
    length: '8'
    order: 6
    key_sequence: 4
    mandatory: true
    origin: {type: Collected, source: Investigator}
    codelist: RPTESTCD
  RPTEST:
    label: 生殖检测的名称
    type: text
    length: '12'
    order: 7
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: RPTEST
  RPORRES:
    label: 结果或发现-原始单位
    type: text
    length: '3'
    order: 9
    mandatory: false
    origin: {type: Collected, source: Investigator}
    comment: NC
  RPLOBXFL:
    label: 暴露前末次观测标帜
    type: text
    length: '1'
    order: 10
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: NY_Y
    method: LOBXFL
  VISITNUM:
    label: 访视编号
    type: float
    length: '1'
    order: 11
    key_sequence: 5
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '9'
    order: 12
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '2'
    order: 13
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 14
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  RPDTC:
    label: 采集的日期/时间
    type: date
    order: 15
    mandatory: false
    origin: {type: Collected, source: Investigator}
  RPDY:
    label: 访视/采集/检查的研究日
    type: integer
    length: '2'
    order: 16
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
supplemental:
  domain: SUPPRP
  label: RP补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPRP
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: supprp.xpt
  has_no_data: true
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '1'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '1'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '1'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '1'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '1'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '1'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '1'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '1'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list: []
    QORIG:
      label: 来源
      type: text
      length: '1'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
