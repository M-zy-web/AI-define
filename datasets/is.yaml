# 首版 is.yaml：m5\datasets\tabulations\sdtm\is.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: IS
label: 免疫原性检测
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次访视每次检测一条记录
sas_dataset: IS
keys:
- USUBJID
- SUBJID
- ISTESTCD
- VISITNUM
- ISDTC
- ISTSTOPO
- ISMSCBCE
archive: is.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    mandatory: false
    origin: {type: Collected, source: Investigator}
  ISSEQ:
    label: 序号
    type: integer
    length: '1'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  ISTESTCD:
    label: 免疫原性检测或检查简称
    type: text
    length: '7'
    order: 6
    key_sequence: 3
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: ISTESTCD
  ISTEST:
    label: 免疫原性检测或检查名称
    type: text
    length: '18'
    order: 7
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: ISTEST
  ISTSTOPO:
    label: 检测操作目的
    type: text
    length: '7'
    order: 8
    mandatory: false
    origin: {type: Collected, source: Vendor}
    codelist: ISTSTOPO
  ISMSCBCE:
    label: 细胞分泌的分子
    type: text
    length: '1'
    order: 9
    mandatory: false
    origin: {type: Collected, source: Vendor}
  ISORRES:
    label: 结果或发现-原始单位
    type: text
    length: '6'
    order: 10
    mandatory: false
    origin: {type: Collected, source: Vendor}
    codelist: ISSTRESC
  ISORRESU:
    label: 原始单位
    type: text
    length: '1'
    order: 11
    mandatory: false
    origin: {type: Collected, source: Vendor}
    codelist: IS_UNIT
    comment: ISORRESU
  ISSTRESC:
    label: 字符型结果/发现-标准格式
    type: text
    length: '6'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: ISSTRESC
    method: STRESC
  ISSTRESN:
    label: 数值型结果/发现-标准单位
    type: integer
    length: '8'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESN
  ISSTRESU:
    label: 标准单位
    type: text
    length: '1'
    order: 14
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: IS_UNIT
    method: STRESU
  ISSTAT:
    label: 完成状态
    type: text
    length: '8'
    order: 15
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: ND
  ISLOBXFL:
    label: 暴露前末次观测标帜
    type: text
    length: '1'
    order: 16
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: NY_Y
    method: LOBXFL
  VISITNUM:
    label: 访视编号
    type: float
    length: '3'
    order: 17
    key_sequence: 4
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '16'
    order: 18
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '3'
    order: 19
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 20
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  ISDTC:
    label: 采集的日期/时间
    type: datetime
    order: 21
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '171'
  ISDY:
    label: 访视/采集/检查的研究日
    type: integer
    length: '3'
    order: 22
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
