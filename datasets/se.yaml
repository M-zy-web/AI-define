# 首版 se.yaml：m5\datasets\tabulations\sdtm\se.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: SE
label: 受试者元素
class: SPECIAL-PURPOSE
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个真实元素一条记录
sas_dataset: SE
keys:
- STUDYID
- USUBJID
- TAETORD
- SESTDTC
archive: se.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
    comment: SE.DOMAIN
    comment_text: SE
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    mandatory: false
    origin: {type: Collected, source: Investigator}
  SESEQ:
    label: 序号
    type: integer
    length: '1'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  ETCD:
    label: 元素编码
    type: text
    length: '5'
    order: 6
    key_sequence: 3
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: ETCD
  ELEMENT:
    label: 元素描述
    type: text
    length: '28'
    order: 7
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
    codelist: ELEMENT
  TAETORD:
    label: 组内元素计划顺序
    type: integer
    length: '1'
    order: 8
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 9
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
    codelist: EPOCH
  SESTDTC:
    label: 元素开始日期/时间
    type: date
    order: 10
    key_sequence: 4
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SESTDTC
    comment: NC
    value_list:
    - where:
      - variable: ETCD
        comparator: EQ
        values:
        - SCRN
      method: SESTDTC.SCRN
      label: 元素开始日期/时间
      origin:
        type: Derived
        source: Sponsor
      mandatory: false
    - where:
      - variable: ETCD
        comparator: EQ
        values:
        - FU
      method: SESTDTC.FU
      label: 元素开始日期/时间
      origin:
        type: Derived
        source: Sponsor
      mandatory: false
  SEENDTC:
    label: 元素结束日期/时间
    type: date
    order: 11
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: SEENDTC
    comment: NC
    value_list:
    - where:
      - variable: ETCD
        comparator: EQ
        values:
        - SCRN
      method: SEENDTC.SCRN
      label: 元素结束日期/时间
      origin:
        type: Derived
        source: Sponsor
      mandatory: false
    - where:
      - variable: ETCD
        comparator: EQ
        values:
        - FU
      method: SEENDTC.FU
      label: 元素结束日期/时间
      origin:
        type: Derived
        source: Sponsor
      mandatory: false
  SESTDY:
    label: 元素开始的研究日
    type: integer
    length: '3'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  SEENDY:
    label: 元素结束的研究日
    type: integer
    length: '3'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
