# 首版 pr.yaml：m5\datasets\tabulations\sdtm\pr.xpt+m5\datasets\tabulations\sdtm\supppr.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: PR
label: 诊疗操作
class: 干预类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个发生的每个诊疗操作一次记录
sas_dataset: PR
keys:
- STUDYID
- USUBJID
- SUBJID
- PRCAT
- PRTRT
- PRSTDTC
- PRENDTC
- PRLOC
- PRDOSE
archive: pr.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  PRSEQ:
    label: 序号
    type: integer
    length: '2'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  PRLNKGRP:
    label: 链接组别ID
    type: text
    length: '17'
    order: 6
    mandatory: false
    origin: {type: Collected, source: Investigator}
  PRTRT:
    label: 诊疗操作名称
    type: text
    length: '200'
    order: 7
    key_sequence: 5
    mandatory: true
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '131'
      - '135'
      - '189'
      - '197'
      - '199'
      - '201'
    codelist: PRTRT
  PRCAT:
    label: 类别
    type: text
    length: '37'
    order: 8
    key_sequence: 4
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: PRCAT
  PRINDC:
    label: 适应症
    type: text
    length: '55'
    order: 9
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '131'
      - '132'
      - '189'
      - '196'
      - '197'
      - '199'
    codelist: PRINDC
  PRDOSE:
    label: 剂量
    type: integer
    length: '4'
    order: 10
    key_sequence: 9
    mandatory: false
    origin: {type: Collected, source: Investigator}
  PRDOSTXT:
    label: 剂量描述
    type: text
    length: '2'
    order: 11
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '132'
      - '196'
  PRDOSU:
    label: 剂量单位
    type: text
    length: '6'
    order: 12
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '132'
      - '196'
    codelist: PR_UNIT
  PRLOC:
    label: 诊疗操作部位
    type: text
    length: '9'
    order: 13
    key_sequence: 8
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '131'
      - '132'
      - '196'
      - '197'
      - '199'
    codelist: PR_LOC
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 14
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  PRSTDTC:
    label: 诊疗操作开始日期/时间
    type: date
    order: 15
    key_sequence: 6
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '131'
      - '132'
      - '135'
      - '189'
      - '196'
      - '197'
      - '198'
      - '199'
      - '201'
  PRENDTC:
    label: 诊疗操作结束日期/时间
    type: date
    order: 16
    key_sequence: 7
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '132'
      - '135'
      - '189'
      - '196'
      - '198'
      - '201'
  PRSTDY:
    label: 诊疗操作开始的研究日
    type: integer
    length: '4'
    order: 17
    mandatory: false
    origin: {type: Derived, source: Sponsor}
