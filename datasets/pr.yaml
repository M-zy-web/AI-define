  PRENDY:
    label: 诊疗操作结束的研究日
    type: integer
    length: '4'
    order: 18
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  PRENRTPT:
    label: 结束时间与参照时点的关系
    type: text
    length: '9'
    order: 19
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: STENRF
    comment: ENRTPT
  PRENTPT:
    label: 结束时间的参照时点
    type: text
    length: '9'
    order: 20
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: ENTPT
    method: ENTPT
supplemental:
  domain: SUPPPR
  label: PR补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPPR
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: supppr.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '2'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '8'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '36'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '115'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRLOCO
        label: 其他部位
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '131'
          - '132'
          - '196'
          - '197'
          - '198'
          - '199'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRTORRES
        label: 肿瘤疗效
        codelist: PRTORRES
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '132'
          - '135'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - TUVISIT
        label: 影像学访视
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRLOC1
        label: 部位1
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRLOC2
        label: 部位2
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRREAS
        label: 治疗原因
        codelist: PRREAS
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '189'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRAENO
        label: 相关AE序号
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '189'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRTLYN
        label: 是否针对靶病灶进行的放疗
        codelist: NY_NY
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '196'
          - '198'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRTRT1
        label: 诊疗操作名称1
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PRINDCO
        label: 其他适应症
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '131'
          - '132'
          - '196'
          - '197'
          - '199'
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
