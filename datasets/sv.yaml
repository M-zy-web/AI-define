# 首版 sv.yaml：m5\datasets\tabulations\sdtm\sv.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: SV
label: 受试者访视
class: SPECIAL-PURPOSE
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次实际访视一条记录
sas_dataset: SV
keys:
- STUDYID
- USUBJID
- VISITNUM
archive: sv.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
    comment: SV.DOMAIN
    comment_text: SV
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    mandatory: false
    origin: {type: Collected, source: Investigator}
  VISITNUM:
    label: 访视编号
    type: float
    length: '5'
    order: 5
    key_sequence: 3
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SV.VISITNUM
    comment: VISITNUM
    comment_text: 计划内访视均来自于TV_DUMMY；非计划内访视按照时间排序，并给出以十进制的访视编号（小数部分），访视编号（整数部分）参考最近的上一次计划内访视
  VISIT:
    label: 访视名称
    type: text
    length: '33'
    order: 6
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: SV.VISIT
    comment: VISIT
    comment_text: 计划内访视均来自于TV_DUMMY；非计划内访视按照时间排序，并给出以十进制的访视编号，访视参考最近的上一次计划内访视和非计划访视编号
  SVPRESP:
    label: 预设
    type: text
    length: '1'
    order: 7
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: NY_Y
  SVOCCUR:
    label: 发生
    type: text
    length: '1'
    order: 8
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: NY_NY
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '3'
    order: 9
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
    comment: SV.VISITDY
    comment_text: 因盲态项目，VISITDY来自于TV_DUMMY
  SVSTDTC:
    label: 观察的开始日期/时间
    type: date
    order: 10
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '124'
    comment: SV.SVSTDTC
    comment_text: 同一访视下最早日期
  SVENDTC:
    label: 观察的结束日期/时间
    type: date
    order: 11
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: SVENDTC
  SVSTDY:
    label: 观察开始的研究日
    type: integer
    length: '3'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  SVENDY:
    label: 观察结束的研究日
    type: integer
    length: '3'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  SVUPDES:
    label: 非计划访视描述
    type: text
    length: '36'
    order: 14
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: SVUPDES
