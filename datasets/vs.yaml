# 首版 vs.yaml：m5\datasets\tabulations\sdtm\vs.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: VS
label: 生命体征
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次访视每个时间点每次生命体征测量一条记录
sas_dataset: VS
keys:
- STUDYID
- USUBJID
- SUBJID
- VSCAT
- VSTESTCD
- VISITNUM
- VSDTC
archive: vs.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  VSSEQ:
    label: 序号
    type: integer
    length: '3'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  VSREFID:
    label: 生命体征参考ID
    type: text
    length: '7'
    order: 6
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
  VSSPID:
    label: 申办方定义标识符
    type: text
    length: '3'
    order: 7
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: SPID
  VSTESTCD:
    label: 生命体征检测简称
    type: text
    length: '6'
    order: 8
    key_sequence: 5
    mandatory: true
    origin: {type: Collected, source: Investigator}
    codelist: VSTESTCD
  VSTEST:
    label: 生命体征检测名称
    type: text
    length: '12'
    order: 9
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: VSTEST
  VSCAT:
    label: 生命体征的类别
    type: text
    length: '12'
    order: 10
    key_sequence: 4
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: VSCAT
  VSORRES:
    label: 结果或发现-原始单位
    type: text
    length: '5'
    order: 11
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '137'
      - '138'
      - '139'
  VSORRESU:
    label: 原始单位
    type: text
    length: '11'
    order: 12
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '125'
      - '137'
      - '138'
      - '139'
    codelist: VSRESU
  VSSTRESC:
    label: 字符型结果/发现-标准格式
    type: text
    length: '5'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESC
  VSSTRESN:
    label: 数值型结果/发现-标准单位
    type: integer
    length: '4'
    order: 14
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESN
  VSSTRESU:
    label: 标准单位
    type: text
    length: '11'
    order: 15
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: VSRESU
    method: STRESU
  VSSTAT:
    label: 完成状态
    type: text
    length: '8'
    order: 16
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: ND
  VSLOBXFL:
    label: 暴露前末次观测标帜
    type: text
    length: '1'
    order: 17
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: NY_Y
    method: LOBXFL
  VISITNUM:
    label: 访视编号
    type: float
    length: '4'
    order: 18
    key_sequence: 6
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '20'
    order: 19
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '3'
    order: 20
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 21
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  VSDTC:
    label: 测量的日期/时间
    type: date
    order: 22
    key_sequence: 7
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '137'
      - '138'
      - '139'
  VSDY:
    label: 生命体征的研究日
    type: integer
    length: '3'
    order: 23
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
