# 首版 mi.yaml：m5\datasets\tabulations\sdtm\mi.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: MI
label: 显微镜发现
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个样本每个发现一条记录
sas_dataset: MI
keys:
- STUDYID
- USUBJID
- SUBJID
- MICAT
- MITESTCD
- MIMETHOD
- VISITNUM
- MIDTC
- MINAM
- MIREFID
archive: mi.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  MISEQ:
    label: 序号
    type: integer
    length: '2'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  MIREFID:
    label: 参考ID
    type: text
    length: '6'
    order: 6
    key_sequence: 10
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
  MITESTCD:
    label: 显微镜检查简称
    type: text
    length: '8'
    order: 7
    key_sequence: 5
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: MITSCD
  MITEST:
    label: 显微镜检查名称
    type: text
    length: '29'
    order: 8
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: MITS
  MICAT:
    label: 显微镜发现的类别
    type: text
    length: '6'
    order: 9
    key_sequence: 4
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: MICAT
  MIORRES:
    label: 结果或发现-原始单位
    type: text
    length: '6'
    order: 10
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: MIORRES
  MISTRESC:
