  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '2'
    order: 21
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 22
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  MIDTC:
    label: 样本采集的日期/时间
    type: date
    order: 23
    key_sequence: 8
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '128'
      - '129'
  MIDY:
    label: 样本采集的研究日
    type: integer
    length: '4'
    order: 24
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
