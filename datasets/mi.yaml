    type: text
    length: '11'
    order: 13
    key_sequence: 9
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
  MISPEC:
    label: 样本种类
    type: text
    length: '12'
    order: 14
    key_sequence: 3
    mandatory: true
    origin: {type: Collected, source: Investigator}
    codelist: MISPECTY
  MISPCCND:
    label: 样本状况
    type: text
    length: '12'
    order: 15
    mandatory: false
    origin: {type: Protocol, source: Investigator}
    codelist: SPECCOND
