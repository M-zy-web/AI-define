# 首版 pc.yaml：m5\datasets\tabulations\sdtm\pc.xpt+m5\datasets\tabulations\sdtm\supppc.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: PC
label: 药代动力学浓度
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个分析物或每个参照时间点每个样本特征或时间点浓度一条记录
sas_dataset: PC
keys:
- STUDYID
- USUBJID
- SUBJID
- PCTESTCD
- VISITNUM
- VISIT
- PCDTC
- PCTPTNUM
archive: pc.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  PCSEQ:
    label: 序号
    type: integer
    length: '2'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  PCTESTCD:
    label: 药代动力学检测简称
    type: text
    length: '8'
    order: 6
    key_sequence: 3
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
  PCTEST:
    label: 药代动力学检测名称
    type: text
    length: '9'
    order: 7
    mandatory: true
    origin: {type: Assigned, source: Vendor}
  PCORRES:
    label: 结果或发现-原始单位
    type: text
    length: '10'
    order: 8
    mandatory: false
    origin: {type: Collected, source: Vendor}
  PCORRESU:
    label: 原始单位
    type: text
    length: '6'
    order: 9
    mandatory: false
    origin: {type: Collected, source: Vendor}
    codelist: PC_UNIT
  PCSTRESC:
    label: 字符型结果/发现-标准格式
    type: text
    length: '10'
    order: 10
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESC
  PCSTRESN:
    label: 数值型结果/发现-标准单位
    type: integer
    length: '5'
    order: 11
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESN
  PCSTRESU:
    label: 标准单位
    type: text
    length: '6'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: PC_SUNIT
    method: STRESU
  PCSTAT:
    label: 完成状态
    type: text
    length: '8'
    order: 13
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: ND
  PCNAM:
    label: 供应商名称
    type: text
    length: '32'
    order: 14
    mandatory: false
    origin: {type: Collected, source: Vendor}
  PCSPEC:
    label: 样本种类
    type: text
    length: '6'
    order: 15
    mandatory: false
    origin: {type: Collected, source: Vendor}
    codelist: PCSPECTY
  PCLLOQ:
    label: 定量下限
    type: float
    length: '3'
    order: 16
    mandatory: false
    origin: {type: Collected, source: Vendor}
  PCULOQ:
    label: 定量上限
    type: float
    length: '2'
    order: 17
    mandatory: false
    origin: {type: Collected, source: Vendor}
  VISITNUM:
    label: 访视编号
    type: float
    length: '3'
    order: 18
    key_sequence: 5
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '16'
    order: 19
    key_sequence: 6
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '3'
    order: 20
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 21
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  PCDTC:
    label: 样本采集的日期/时间
    type: datetime
    order: 22
    key_sequence: 7
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '172'
      - '173'
      - '174'
      - '175'
  PCDY:
    label: 样本采集的实际研究日
    type: integer
    length: '3'
    order: 23
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  PCTPT:
    label: 计划时点名称
    type: text
    length: '13'
    order: 24
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '172'
      - '173'
      - '175'
    codelist: PCTPT
  PCTPTNUM:
    label: 计划时点编号
    type: integer
    length: '1'
    order: 25
    key_sequence: 8
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: PCTPTNUM
supplemental:
  domain: SUPPPC
  label: PC补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPPC
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: supppc.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '2'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '6'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '12'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '2'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DLUFAC
        label: 稀释系数
        origin: {type: Collected, source: Vendor}
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
