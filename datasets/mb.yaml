# 首版 mb.yaml：m5\datasets\tabulations\sdtm\mb.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: MB
label: 微生物检测
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次访视每个时间点每次微生物标本发现一条记录
sas_dataset: MB
keys:
- STUDYID
- USUBJID
- SUBJID
- MBTESTCD
- VISITNUM
- MBDTC
archive: mb.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  MBSEQ:
    label: 序号
    type: integer
    length: '2'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  MBSPID:
    label: 申办方定义标识符
    type: text
    length: '3'
    order: 6
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: SPID
  MBTESTCD:
    label: 微生物检测或发现简称
    type: text
    length: '5'
    order: 7
    key_sequence: 3
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: MBTESTCD
  MBTEST:
    label: 微生物检测或发现名称
    type: text
    length: '30'
    order: 8
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: MBTEST
  MBTSTDTL:
    label: 测量，检测或检查详情
    type: text
    length: '12'
    order: 9
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: MBFTSDTL
  MBCAT:
    label: 类别
    type: text
    length: '30'
    order: 10
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: MBCAT
  MBORRES:
    label: 结果或发现-原始单位
    type: text
    length: '6'
    order: 11
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '153'
      - '154'
      - '155'
    codelist: MBORRES
  MBORRESU:
    label: 原始单位
    type: text
    length: '5'
    order: 12
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '154'
      - '155'
    codelist: MB_UNIT
  MBSTRESC:
    label: 字符型结果/发现-标准格式
    type: text
    length: '6'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: MBORRES
    method: STRESC
  MBSTRESN:
    label: 数值型结果/发现-标准单位
    type: integer
    length: '8'
    order: 14
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESN
  MBSTRESU:
    label: 标准单位
    type: text
    length: '5'
    order: 15
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: MB_UNIT
    method: STRESU
  MBSTAT:
    label: 完成状态
    type: text
    length: '8'
    order: 16
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: ND
  MBNAM:
    label: 实验室/供应商名称
    type: text
    length: '83'
    order: 17
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '154'
      - '155'
  MBLOBXFL:
    label: 暴露前末次观测标帜
    type: text
    length: '1'
    order: 18
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: NY_Y
    method: LOBXFL
  VISITNUM:
    label: 访视编号
    type: float
    length: '4'
    order: 19
    key_sequence: 5
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '20'
    order: 20
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '2'
    order: 21
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 22
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  MBDTC:
    label: 采集的日期/时间
    type: date
    order: 23
    key_sequence: 6
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '153'
      - '154'
      - '155'
  MBDY:
    label: 访视/采集/检查的研究日
    type: integer
    length: '3'
    order: 24
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  MBORNRLO:
    label: 参考结果下限
    type: text
    length: '1'
    order: 25
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '154'
      - '155'
  MBORNRHI:
    label: 参考结果上限
    type: text
    length: '5'
    order: 26
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '154'
      - '155'
