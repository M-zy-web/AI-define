# 首版 cv.yaml：m5\datasets\tabulations\sdtm\cv.xpt+m5\datasets\tabulations\sdtm\suppcv.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: CV
label: 心血管系统检查结果
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次访视每个时间点每次发现或结果一条记录
sas_dataset: CV
keys:
- USUBJID
- SUBJID
- CVTESTCD
- VISITNUM
- VISIT
- CVDTC
archive: cv.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  CVSEQ:
    label: 序号
    type: integer
    length: '2'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  CVTESTCD:
    label: 心血管检测的简称
    type: text
    length: '4'
    order: 6
    key_sequence: 4
    mandatory: true
    origin: {type: Collected, source: Investigator}
    codelist: CVTESTCD
  CVTEST:
    label: 心血管检测的名称
    type: text
    length: '21'
    order: 7
    mandatory: true
    origin: {type: Collected, source: Investigator}
    codelist: CVTEST
  CVORRES:
    label: 结果或发现-原始单位
    type: text
    length: '5'
    order: 8
    mandatory: false
    origin: {type: Collected, source: Investigator}
  CVORRESU:
    label: 原始单位
    type: text
    length: '1'
    order: 9
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '160'
    codelist: CV_UNIT
  CVSTRESC:
    label: 字符型结果/发现-标准格式
    type: text
    length: '5'
    order: 10
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESC
  CVSTRESN:
    label: 数值型结果/发现-标准单位
    type: integer
    length: '4'
    order: 11
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESN
  CVSTRESU:
    label: 标准单位
    type: text
    length: '1'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: CV_UNIT
    method: STRESU
  CVSTAT:
    label: 完成状态
    type: text
    length: '1'
    order: 13
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: ND
    comment: STAT
  CVMETHOD:
    label: 检测或检查的方法
    type: text
    length: '27'
    order: 14
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '160'
    codelist: CVMETHOD
  CVLOBXFL:
    label: 暴露前末次观测标帜
    type: text
    length: '1'
    order: 15
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: NY_Y
    method: LOBXFL
  VISITNUM:
    label: 访视编号
    type: float
    length: '5'
    order: 16
    key_sequence: 3
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '20'
    order: 17
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '3'
    order: 18
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 19
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  CVDTC:
    label: 检测的日期/时间
    type: date
    order: 20
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '160'
  CVDY:
    label: 访视/采集/检查的研究日
    type: integer
    length: '3'
    order: 21
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
supplemental:
  domain: SUPPCV
  label: CV补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPCV
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppcv.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '2'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '7'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '13'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '200'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CVCLSIG
        label: 临床意义
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CVDESC
        label: 异常描述
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '160'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CVDESC1
        label: 异常描述1
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CVDESC2
        label: 异常描述2
        origin: {type: Collected, source: Investigator}
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
