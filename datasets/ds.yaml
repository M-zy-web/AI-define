# 首版 ds.yaml：m5\datasets\tabulations\sdtm\ds.xpt+m5\datasets\tabulations\sdtm\suppds.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: DS
label: 受试者分布
class: 事件类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个分布状态或每一方案里程碑事件一条记录
sas_dataset: DS
keys:
- USUBJID
- SUBJID
- DSSTDTC
- DSCAT
- DSSCAT
- DSDECOD
archive: ds.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    mandatory: false
    origin: {type: Collected, source: Investigator}
  DSSEQ:
    label: 序号
    type: integer
    length: '1'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  DSTERM:
    label: 分布事件报告术语
    type: text
    length: '197'
    order: 6
    mandatory: true
    origin:
      type: Assigned
      source: Sponsor
      crf_pages:
      - '190'
      - '191'
      - '192'
      - '193'
      - '194'
      - '195'
      - '202'
  DSDECOD:
    label: 标准化分布事件术语
    type: text
    length: '21'
    order: 7
    key_sequence: 3
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
  DSCAT:
    label: 分布事件的类别
    type: text
    length: '21'
    order: 8
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: DSCAT
  DSSCAT:
    label: 分布事件的子类
    type: text
    length: '33'
    order: 9
    mandatory: false
    origin:
      type: Assigned
      source: Sponsor
      crf_pages:
      - '190'
      - '191'
      - '192'
      - '193'
      - '194'
      - '195'
    codelist: DSSCAT
  DSDTC:
    label: 采集的日期/时间
    type: date
    order: 10
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '164'
      - '190'
      - '191'
      - '192'
      - '193'
      - '194'
      - '195'
      - '202'
      - '207'
  DSSTDTC:
    label: 分布事件开始日期/时间
    type: date
    order: 11
    key_sequence: 4
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '164'
      - '190'
      - '191'
      - '192'
      - '193'
      - '194'
      - '195'
      - '207'
  DSDY:
    label: 采集的研究日
    type: integer
    length: '3'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  DSSTDY:
    label: 分布事件开始的研究日
    type: integer
    length: '3'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
supplemental:
