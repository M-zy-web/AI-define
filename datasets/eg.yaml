# 首版 eg.yaml：m5\datasets\tabulations\sdtm\eg.xpt+m5\datasets\tabulations\sdtm\suppeg.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: EG
label: 心电图
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个时间点每个重复的每次心电图观测一条记录，或每个受试者每次访视每次心电图观测一条记录
sas_dataset: EG
keys:
- STUDYID
- USUBJID
- SUBJID
- EGTESTCD
- VISITNUM
- EGDTC
- EGGRPID
archive: eg.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  EGSEQ:
    label: 序号
    type: integer
    length: '3'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  EGREFID:
    label: 心电图参考ID
    type: text
    length: '7'
    order: 6
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
  EGTESTCD:
    label: 心电图检测或检查简称
    type: text
    length: '6'
    order: 7
    key_sequence: 4
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: EGTESTCD
  EGTEST:
    label: 心电图检测或检查名称
    type: text
    length: '18'
    order: 8
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: EGTEST
  EGORRES:
    label: 结果或发现-原始单位
    type: text
    length: '21'
    order: 9
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '156'
      - '157'
      - '158'
      - '159'
  EGORRESU:
    label: 原始单位
    type: text
    length: '9'
    order: 10
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '156'
      - '157'
      - '158'
      - '159'
    codelist: EG_UNIT
  EGSTRESC:
    label: 字符型结果/发现-标准格式
    type: text
    length: '21'
    order: 11
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESC
  EGSTRESN:
    label: 数值型结果/发现-标准单位
    type: integer
    length: '11'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: STRESN
  EGSTRESU:
    label: 标准单位
    type: text
    length: '9'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EG_UNIT
    method: STRESU
  EGSTAT:
    label: 完成状态
    type: text
    length: '1'
    order: 14
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: ND
  EGMETHOD:
    label: 检测或检查的方法
    type: text
    length: '17'
    order: 15
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: EGMETHOD
  EGLOBXFL:
    label: 暴露前末次观测标帜
    type: text
    length: '1'
    order: 16
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: NY_Y
    method: LOBXFL
  EGDRVFL:
    label: 衍生标帜
    type: text
    length: '1'
    order: 17
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: NY_Y
    comment: EGDRVFL
  VISITNUM:
    label: 访视编号
    type: float
    length: '5'
    order: 18
    key_sequence: 5
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '24'
    order: 19
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '3'
    order: 20
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 21
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  EGDTC:
    label: 心电图的日期/时间
    type: date
    order: 22
    key_sequence: 6
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '156'
      - '157'
      - '158'
      - '159'
  EGDY:
    label: 心电图的研究日
    type: integer
    length: '3'
    order: 23
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
supplemental:
  domain: SUPPEG
  label: EG补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPEG
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppeg.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '3'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '7'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '13'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '197'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - EGDESC
        label: 异常描述
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '156'
          - '157'
          - '158'
          - '159'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - EGDESC1
        label: 异常描述1
        origin: {type: Collected, source: Investigator}
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
