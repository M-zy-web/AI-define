# 首版 dd.yaml：m5\datasets\tabulations\sdtm\dd.xpt+m5\datasets\tabulations\sdtm\suppdd.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: DD
label: 死亡详情
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个发现一条记录
sas_dataset: DD
keys:
- STUDYID
- USUBJID
- DDTESTCD
- DDDTC
archive: dd.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  DDSEQ:
    label: 序号
    type: integer
    length: '1'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  DDTESTCD:
    label: 死亡详情评估简称
    type: text
    length: '6'
    order: 6
    key_sequence: 4
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DTHDXCD
  DDTEST:
    label: 死亡详情评估名称
    type: text
    length: '18'
    order: 7
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DTHDX
  DDORRES:
    label: 采集的结果或发现
    type: text
    length: '12'
    order: 8
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: DTHRS
  DDSTRESC:
    label: 字符型结果/发现-标准格式
    type: text
    length: '12'
    order: 9
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: DTHRS
    method: STRESC
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 10
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  DDDTC:
    label: 采集的日期/时间
    type: date
    order: 11
    key_sequence: 4
    mandatory: false
    origin: {type: Collected, source: Investigator}
  DDDY:
    label: 采集的研究日
    type: integer
    length: '3'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
supplemental:
  domain: SUPPDD
  label: DD补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPDD
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppdd.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '1'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '8'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '18'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '7'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DTHREASO
        label: 其他死亡原因
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '202'
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
