# 首版 ss.yaml：m5\datasets\tabulations\sdtm\ss.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: SS
label: 受试者状态
class: 发现类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次访视每次状态一条记录
sas_dataset: SS
keys:
- STUDYID
- USUBJID
- SUBJID
- SSTESTCD
- VISITNUM
archive: ss.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    mandatory: false
    origin: {type: Collected, source: Investigator}
  SSSEQ:
    label: 序号
    type: integer
    length: '1'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  SSTESTCD:
    label: 状态简称
    type: text
    length: '8'
    order: 6
    key_sequence: 3
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: SSTESTCD
  SSTEST:
    label: 状态名称
    type: text
    length: '12'
    order: 7
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: SSTEST
  SSORRES:
    label: 结果或发现-原始单位
    type: text
    length: '6'
    order: 8
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '204'
    codelist: SSORRES
  SSSTRESC:
    label: 字符型结果/发现-标准格式
    type: text
    length: '6'
    order: 9
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: SSTATRS
    method: STRESC
  VISITNUM:
    label: 访视编号
    type: float
    length: '3'
    order: 10
    key_sequence: 4
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '18'
    order: 11
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '8'
    order: 12
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
    comment: SS.VISITDY
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  SSDTC:
    label: 评估的日期/时间
    type: date
    order: 14
    key_sequence: 5
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '204'
  SSDY:
    label: 评估的研究日
    type: integer
    length: '3'
    order: 15
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
