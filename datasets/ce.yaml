# 首版 ce.yaml：m5\datasets\tabulations\sdtm\ce.xpt+m5\datasets\tabulations\sdtm\suppce.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: CE
label: 临床事件
class: 事件类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个临床事件一条记录
sas_dataset: CE
keys:
- STUDYID
- USUBJID
- SUBJID
- CETERM
- VISITNUM
- CESTDTC
archive: ce.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
    comment: CE.DOMAIN
    comment_text: CE
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  CESEQ:
    label: 序号
    type: integer
    length: '1'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  CESPID:
    label: 申办方定义标识符
    type: text
    length: '3'
    order: 6
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: SPID
  CETERM:
    label: 临床事件报告术语
    type: text
    length: '19'
    order: 7
    key_sequence: 4
    mandatory: true
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '205'
      - '206'
  CECAT:
    label: 临床事件的类别
    type: text
    length: '18'
    order: 8
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: CECAT
  CETOXGR:
    label: 标准毒性等级
    type: text
    length: '1'
    order: 9
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '205'
      - '206'
    codelist: CETOXGR
  CESTDTC:
    label: 临床事件开始日期/时间
    type: date
    order: 10
    key_sequence: 4
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '205'
      - '206'
  CEENDTC:
    label: 临床事件结束日期/时间
    type: date
    order: 11
    mandatory: false
    origin:
      type: Collected
      source: Investigator
      crf_pages:
      - '205'
      - '206'
  CESTDY:
    label: 临床事件开始的研究日
    type: integer
    length: '1'
    order: 12
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  CEENDY:
    label: 临床事件结束的研究日
    type: integer
    length: '1'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  CEENRTPT:
    label: 结束时间与参照时点的关系
    type: text
    length: '1'
    order: 14
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: STENRF
    comment: ENRTPT
  CEENTPT:
    label: 结束时间的参照时点
    type: text
    length: '1'
    order: 15
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: ENTPT
    comment: ENTPT
supplemental:
  domain: SUPPCE
  label: CE补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPCE
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppce.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '1'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '6'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '14'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '1'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - FAAENO
        label: 相关AE序号
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '205'
          - '206'
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
