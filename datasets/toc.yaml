# 数据集顺序表：按 SDTM-MSG Class 大类顺序，Class 内按 TOC 行序。
# Class 顺序: ['TRIAL DESIGN', 'SPECIAL-PURPOSE', 'INTERVENTIONS', 'EVENTS', 'FINDINGS', 'FINDINGS ABOUT', 'RELATIONSHIP', 'STUDY REFERENCE']
# 来源: study_std\spec-sdtm-SHR-1234-III-301-define.xlsx Sheet=TOC，仅含本次成功生成的 34 个域，保留全部原始字段。
- dataset: TA
  Description: Trial Arms
  DescriptionCN: 试验分组
  Class: TRIAL DESIGN
  Structure: One record per planned Element per Arm
  StructureCN: 每个分支每个计划元素一条记录
  Purpose: Tabulation
  Keys: STUDYID, ARMCD, TAETORD
  Repeating: N
  IsReferenceData: Y
  Location: ta.xpt
  Flag: K
  HR Notes: 一般情况简单处理，试验设计复杂时，如涉及多个不同剂量的药物联用，由TA leader决定统一做法
- dataset: TE
  Description: Trial Elements
  DescriptionCN: 试验元素
  Class: TRIAL DESIGN
  Structure: One record per planned Element
  StructureCN: 每个计划元素一条记录
  Purpose: Tabulation
  Keys: STUDYID, ETCD
  Repeating: N
  IsReferenceData: Y
  Location: te.xpt
  Flag: K
- dataset: TI
  Description: Trial Inclusion/Exclusion Criteria
  DescriptionCN: 试验入选/排除标准
  Class: TRIAL DESIGN
  Structure: One record per I/E criterion
  StructureCN: 每个入选/排除标准一条记录
  Purpose: Tabulation
  Keys: STUDYID, IETESTCD
  Repeating: N
  IsReferenceData: Y
  Location: ti.xpt
  Flag: K
- dataset: TS
  Description: Trial Summary
  DescriptionCN: 试验概要
  Class: TRIAL DESIGN
  Structure: One record per trial summary parameter value
  StructureCN: 每个试验概要参数值一条记录
  Purpose: Tabulation
  Keys: STUDYID, TSPARMCD, TSSEQ
  Repeating: N
  IsReferenceData: Y
  Location: ts.xpt
  Flag: K
  HR Notes: 非递交项目、CDE递交项目不做
- dataset: TV
  Description: Trial Visits
  DescriptionCN: 试验访视
  Class: TRIAL DESIGN
  Structure: One record per planned Visit per Arm
  StructureCN: 每个分支每个计划访视一条记录
  Purpose: Tabulation
  Keys: STUDYID, ARMCD, VISITNUM
  Repeating: N
  IsReferenceData: Y
  Location: tv.xpt
  Flag: K
  HR Notes: '包括所有EDC设计的访视folder，如治疗结束页和研究结束页，无论是否有实际访视

    EDC设计和肿瘤评估拆分处理，做成两组独立的访视；'
- dataset: DM
