  IsReferenceData: N
  Location: dm.xpt
  Flag: K
  StandardOID: SDTM-IG
  HR Notes: 如果有重复筛选，DC保留完整记录，DM保留末次筛选记录，同时其他domain增加SUBJID用来区分同一受试者的多次筛选结果
