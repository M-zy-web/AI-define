# 首版 dc.yaml：m5\datasets\tabulations\sdtm\dc.xpt+m5\datasets\tabulations\sdtm\suppdc.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: DC
label: 人口学收集
class: SPECIAL-PURPOSE
purpose: 列表
repeating: false
is_reference_data: false
structure: 每个受试者一条记录
sas_dataset: DC
keys:
- STUDYID
- USUBJID
- SUBJID
archive: dc.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Investigator}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
    comment: DC.DOMAIN
    comment_text: DC
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: true
    origin: {type: Collected, source: Investigator}
  DCSEQ:
    label: 序号
    type: integer
    length: '1'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  RFSTDTC:
    label: 受试者参照开始日期
    type: date
    order: 6
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: RFSTDTC
  RFENDTC:
    label: 受试者参照结束日期/时间
    type: date
    order: 7
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: RFENDTC
  RFXSTDTC:
    label: 首次研究治疗日期/时间
    type: date
    order: 8
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: RFXSTDTC
  RFXENDTC:
    label: 末次研究治疗日期/时间
    type: date
    order: 9
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: RFXENDTC
  RFICDTC:
    label: 知情同意日期/时间
    type: date
    order: 10
    mandatory: false
    origin: {type: Collected, source: Investigator}
    comment: DC.RFICDTC
    comment_text: 首次知情同意日期
  RFPENDTC:
    label: 参与结束日期/时间
    type: date
    order: 11
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: RFPENDTC
  DTHDTC:
    label: 死亡日期/时间
    type: date
    order: 12
    mandatory: false
    origin: {type: Collected, source: Investigator}
    comment: DC.DTHDTC
    comment_text: 最早的死亡报告日期
  DTHFL:
    label: 死亡标帜
    type: text
    length: '1'
    order: 13
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: NY_Y
    method: DTHFL
  SITEID:
    label: 研究中心标识符
    type: text
    length: '5'
    order: 14
    mandatory: true
    origin: {type: Collected, source: Investigator}
  INVNAM:
    label: 研究者姓名
    type: text
    length: '15'
    order: 15
    mandatory: false
    origin: {type: Collected, source: Investigator}
  BRTHDTC:
    label: 出生日期/时间
    type: date
    order: 16
    mandatory: false
    origin: {type: Collected, source: Investigator}
  AGE:
    label: 年龄
    type: integer
    length: '2'
    order: 17
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: AGE
  AGEU:
    label: 年龄单位
    type: text
    length: '3'
    order: 18
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: AGEU
  SEX:
    label: 性别
    type: text
    length: '3'
    order: 19
    mandatory: true
    origin: {type: Collected, source: Investigator}
    codelist: SEX
  RACE:
    label: 人种
    type: text
    length: '9'
    order: 20
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
    codelist: RACE
  ARMCD:
    label: 计划分组编码
    type: text
    length: '1'
    order: 21
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: ARMCD
  ARM:
    label: 计划分组描述
    type: text
    length: '11'
    order: 22
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
    codelist: ARM
  ACTARMCD:
    label: 实际分组编码
    type: text
    length: '1'
    order: 23
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: ARMCD
  ACTARM:
    label: 实际分组描述
    type: text
    length: '11'
    order: 24
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: ARM
  ARMNRS:
    label: 计划或实际分组缺失原因
    type: text
    length: '21'
    order: 25
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: ARMNULRS
  ACTARMUD:
    label: 非计划实际分组描述
    type: text
    length: '1'
    order: 26
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: DC.ACTARMUD
    comment_text: 如果非空actarm和非空arm不同，则记录ACTARMUD="UNPLAN DOSE"
  COUNTRY:
    label: 国家
    type: text
    length: '3'
    order: 27
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: ISO3166
supplemental:
  domain: SUPPDC
  label: DC补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPDC
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppdc.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '1'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '8'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '27'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '110'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CETHNIC
        label: 族裔采集
        codelist: ETHNICC
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '125'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DSRSF
        label: 分层因素
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '163'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DSRSF1
        label: HR and CDK4/6
        codelist: DSRSFHR
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '163'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DSRSF2
        label: 化疗线数
        codelist: DSRSFLNE
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '163'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - RANDID
        label: 随机号
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '164'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - REGIME
        label: 给药方案
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '164'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - REGIMEN
        label: 治疗方案
        codelist: REGIMEN
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '163'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - RSTRAT
        label: 随机系统分层因素
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - TIVERS
        label: 方案版本
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '163'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - PSUBJID
        label: 之前的受试者标识符
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '125'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - CETHNICO
        label: 其他族裔采集
        codelist: ETHNICC
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '125'
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
