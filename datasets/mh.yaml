  MHHLT:
    label: 高位术语
    type: text
    length: '63'
    order: 13
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: MEDDRACT
    comment: MEDDRA
  MHHLTCD:
    label: 高位术语的编码
    type: integer
    length: '8'
