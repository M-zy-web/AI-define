supplemental:
  domain: SUPPMH
  label: MH补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPMH
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppmh.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '2'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '8'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '21'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '15'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DICTNAME
        label: 字典名称
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DICTVER
        label: 字典版本
        origin: {type: Assigned, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHCT
        label: 首次临床分期
        codelist: MHCT
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '127'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHFPDDTC
        label: 首次转移日期
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '127'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHHG
        label: 首次组织学分级
        codelist: MHHG
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '126'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHLCT
        label: 当前临床分期
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '127'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHLPDDTC
        label: 最近转移日期
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '127'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHRM
        label: 复发/转移情况
        codelist: MHRM
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '127'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHTNMM
        label: TNM分期(M)
        codelist: MHTNMUN
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '126'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHTNMN
        label: TNM分期(N)
        codelist: MHTNMUN
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '126'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - MHTNMT
        label: TNM分期(T)
        codelist: MHTNMUN
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '126'
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '21'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
