# 首版 mh.yaml：m5\datasets\tabulations\sdtm\mh.xpt+m5\datasets\tabulations\sdtm\suppmh.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: MH
label: 病史
class: 事件类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个病史一条记录
sas_dataset: MH
keys:
- STUDYID
- USUBJID
- SUBJID
- MHCAT
- MHTERM
- MHDECOD
- MHSTDTC
- MHENDTC
- MHEVDTYP
archive: mh.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  MHSEQ:
    label: 序号
    type: integer
    length: '2'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  MHSPID:
    label: 申办方定义标识符
    type: text
    length: '3'
    order: 6
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
