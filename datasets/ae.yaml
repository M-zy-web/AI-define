supplemental:
  domain: SUPPAE
  label: AE补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPAE
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppae.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '3'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '8'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '36'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '39'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AESI
        label: 特殊AE事件
        codelist: NY
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '186'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AETRTEM
        label: 治疗引起标帜
        method: AETRTEM
        origin: {type: Derived, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DICTNAME
        label: 字典名称
        comment: AE.DICTNAME
        comment_text: aeeval='Sponsor';
        origin: {type: Collected, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - DICTVER
        label: 字典版本
        comment: AE.DICTVER
        comment_text: aeeval='Sponsor';
        origin: {type: Collected, source: Sponsor}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - EXTRT
        label: 药物名称
        codelist: REGIMEN
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '185'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AEACNE
        label: 对ComparatorC治疗采取的措施
        codelist: ACN
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '185'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AERELE
        label: ComparatorC相关性相关性
        codelist: AEREL
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '186'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AEACNP
        label: 对ComparatorA治疗采取的措施
        codelist: ACN
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '185'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AERELP
        label: ComparatorA相关性
        codelist: AEREL
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '186'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AEACNPA
        label: 对Special Form治疗采取的措施
        codelist: ACN
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '185'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AERELPA
        label: Special Form相关性
        codelist: AEREL
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '186'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - AESOSP
        label: 其他重要严重医疗事件
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '186'
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
