# 首版 ae.yaml：m5\datasets\tabulations\sdtm\ae.xpt+m5\datasets\tabulations\sdtm\suppae.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: AE
label: 不良事件
class: 事件类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每个不良事件每发生一次一条记录
sas_dataset: AE
keys:
- STUDYID
- USUBJID
- SUBJID
- AESPID
archive: ae.xpt
