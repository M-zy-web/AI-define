# 首版 ec.yaml：m5\datasets\tabulations\sdtm\ec.xpt+m5\datasets\tabulations\sdtm\suppec.xpt(结构) + xlsx(语义) + 部门值级库 + aCRF(页码) 合成。之后由 AI 维护。
domain: EC
label: 暴露采集
class: 干预类
purpose: 列表
repeating: true
is_reference_data: false
structure: 每个受试者每次收集用药间隔一条记录
sas_dataset: EC
keys:
- STUDYID
- USUBJID
- SUBJID
- ECTRT
- ECSTDTC
- ECMOOD
- ECSPID
archive: ec.xpt
variables:
  STUDYID:
    label: 研究标识符
    type: text
    length: '8'
    order: 1
    key_sequence: 1
    mandatory: true
    origin: {type: Protocol, source: Sponsor}
  DOMAIN:
    label: 域名缩写
    type: text
    length: '2'
    order: 2
    mandatory: true
    origin: {type: Assigned, source: Sponsor}
    codelist: DOMAIN
  USUBJID:
    label: 受试者唯一标识符
    type: text
    length: '23'
    order: 3
    key_sequence: 2
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: USUBJID
  SUBJID:
    label: 受试者标识符
    type: text
    length: '8'
    order: 4
    key_sequence: 3
    mandatory: false
    origin: {type: Collected, source: Investigator}
  ECSEQ:
    label: 序号
    type: integer
    length: '2'
    order: 5
    mandatory: true
    origin: {type: Derived, source: Sponsor}
    method: SEQ
  ECSPID:
    label: 申办方定义标识符
    type: text
    length: '12'
    order: 6
    key_sequence: 7
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: SPID
  ECTRT:
    label: 治疗名称
    type: text
    length: '33'
    order: 7
    key_sequence: 4
    mandatory: true
    origin: {type: Collected, source: Investigator}
    codelist: CXTRT
  ECMOOD:
    label: 情景模式
    type: text
    length: '6'
    order: 8
    key_sequence: 6
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: BRDGMOOD
  ECPRESP:
    label: 预设
    type: text
    length: '1'
    order: 9
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: NY_Y
  ECOCCUR:
    label: 发生
    type: text
    length: '1'
    order: 10
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: NY_NY
  ECREASOC:
    label: 发生的原因
    type: text
    length: '12'
    order: 11
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: ADJ
  ECDOSE:
    label: 剂量
    type: integer
    length: '5'
    order: 12
    mandatory: false
    origin: {type: Collected, source: Investigator}
  ECDOSTXT:
    label: 剂量描述
    type: text
    length: '1'
    order: 13
    mandatory: false
    origin: {type: Collected, source: Investigator}
  ECDOSU:
    label: 剂量单位
    type: text
    length: '2'
    order: 14
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: CX_UNIT
  ECDOSFRM:
    label: 剂型
    type: text
    length: '9'
    order: 15
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
    codelist: CX_FRM
  ECROUTE:
    label: 给药途径
    type: text
    length: '6'
    order: 16
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    codelist: CX_ROUTE
  ECLOT:
    label: 批号
    type: text
    length: '23'
    order: 17
    mandatory: false
    origin: {type: Collected, source: Investigator}
  ECADJ:
    label: 剂量调整原因
    type: text
    length: '12'
    order: 18
    mandatory: false
    origin: {type: Collected, source: Investigator}
    codelist: ADJ
  VISITNUM:
    label: 访视编号
    type: float
    length: '3'
    order: 19
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISITNUM
  VISIT:
    label: 访视名称
    type: text
    length: '5'
    order: 20
    mandatory: false
    origin: {type: Assigned, source: Sponsor}
    comment: VISIT
  VISITDY:
    label: 访视计划研究日
    type: integer
    length: '3'
    order: 21
    mandatory: false
    origin: {type: Protocol, source: Sponsor}
  EPOCH:
    label: 时期
    type: text
    length: '9'
    order: 22
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    codelist: EPOCH
    method: EPOCH
  ECSTDTC:
    label: 治疗开始日期/时间
    type: datetime
    order: 23
    key_sequence: 5
    mandatory: false
    origin: {type: Collected, source: Investigator}
  ECENDTC:
    label: 治疗结束日期/时间
    type: datetime
    order: 24
    mandatory: false
    origin: {type: Collected, source: Investigator}
  ECSTDY:
    label: 治疗开始的研究日
    type: integer
    length: '3'
    order: 25
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
  ECENDY:
    label: 治疗结束的研究日
    type: integer
    length: '3'
    order: 26
    mandatory: false
    origin: {type: Derived, source: Sponsor}
    method: DY
supplemental:
  domain: SUPPEC
  label: EC补充修饰语数据集
  class: 关联数据
  purpose: 列表
  repeating: true
  is_reference_data: false
  structure: 一个域一个修饰变量一条记录
  sas_dataset: SUPPEC
  keys:
  - STUDYID
  - RDOMAIN
  - USUBJID
  - IDVAR
  - IDVARVAL
  - QNAM
  archive: suppec.xpt
  variables:
    STUDYID:
      label: 研究标识符
      type: text
      length: '8'
      order: 1
      mandatory: true
      key_sequence: 1
      origin: {type: Protocol, source: Sponsor}
    RDOMAIN:
      label: 关联域名缩写
      type: text
      length: '2'
      order: 2
      mandatory: true
      key_sequence: 2
      origin: {type: Assigned, source: Sponsor}
      codelist: DOMAIN
    USUBJID:
      label: 受试者唯一标识符
      type: text
      length: '23'
      order: 3
      mandatory: true
      key_sequence: 3
      origin: {type: Derived, source: Sponsor}
      method: USUBJID
    IDVAR:
      label: 标识变量
      type: text
      length: '5'
      order: 4
      mandatory: false
      key_sequence: 4
      origin: {type: Assigned, source: Sponsor}
    IDVARVAL:
      label: 标识变量值
      type: text
      length: '2'
      order: 5
      mandatory: false
      key_sequence: 5
      origin: {type: Assigned, source: Sponsor}
    QNAM:
      label: 修饰语变量名称
      type: text
      length: '8'
      order: 6
      mandatory: true
      key_sequence: 6
      origin: {type: Assigned, source: Sponsor}
    QLABEL:
      label: 修饰语变量标签
      type: text
      length: '36'
      order: 7
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QVAL:
      label: 数据值
      type: text
      length: '200'
      order: 8
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
      value_list:
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECDOSADJ
        label: 计划剂量调整
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECPDOSL
        label: 计划剂量水平
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECPDOSLU
        label: 计划剂量水平单位
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECITRPYN
        label: 输液是否中断
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '165'
          - '166'
          - '167'
          - '168'
          - '169'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECAENO
        label: 导致未给药/延迟给药的AE号
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '165'
          - '166'
          - '167'
          - '168'
          - '169'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECYN
        label: 是否按照计划给药
        codelist: DSIADRS
        origin:
          type: Collected
          source: Investigator
          crf_pages:
          - '165'
          - '166'
          - '167'
          - '168'
          - '169'
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECREASP
        label: 未计划用药的其他原因
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECADAENO
        label: 导致计划计量调整AE号
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECREASP1
        label: 未计划用药的其他原因1
        origin: {type: Collected, source: Investigator}
        mandatory: false
      - where:
        - variable: QNAM
          comparator: EQ
          values:
          - ECREASP2
        label: 未计划用药的其他原因2
        origin: {type: Collected, source: Investigator}
        mandatory: false
    QORIG:
      label: 来源
      type: text
      length: '9'
      order: 9
      mandatory: true
      origin: {type: Assigned, source: Sponsor}
    QEVAL:
      label: 评估人员
      type: text
      length: '1'
      order: 10
      mandatory: false
      origin: {type: Assigned, source: Sponsor}
